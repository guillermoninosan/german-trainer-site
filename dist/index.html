<title>German Trainer</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1f2328; --muted:#6a7078; --line:#e2e0d8;
  --accent:#1f5fbf; --accent-ink:#ffffff; --accent-soft:#e6eefb;
  --good:#1a7f45; --good-soft:#e2f4ea; --bad:#b3261e; --bad-soft:#fbe7e5; --warn:#8a5a00; --warn-soft:#fdf1d8;
  --irr:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --card:#1e2126; --ink:#eceef1; --muted:#9aa1ab; --line:#30353c;
    --accent:#6ea2f5; --accent-ink:#0d1b33; --accent-soft:#1d2b45;
    --good:#5fd08b; --good-soft:#173324; --bad:#ff8a80; --bad-soft:#3b1c1a; --warn:#f3c56b; --warn-soft:#3a2f14;
    --irr:#ff8a80;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --card:#1e2126; --ink:#eceef1; --muted:#9aa1ab; --line:#30353c;
  --accent:#6ea2f5; --accent-ink:#0d1b33; --accent-soft:#1d2b45;
  --good:#5fd08b; --good-soft:#173324; --bad:#ff8a80; --bad-soft:#3b1c1a; --warn:#f3c56b; --warn-soft:#3a2f14;
  --irr:#ff8a80;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
/* Installed-app status bar on iOS renders "black-translucent" (overlaying the page),
   so without the safe-area-inset-top padding above, the header sits under the clock/
   battery icons and its buttons (incl. the dark-mode toggle) become unreachable. */
#wrap{max-width:720px;margin:0 auto;padding:14px 0 60px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header h1{font-size:20px;margin:0;flex:1;letter-spacing:.2px}
header .sub{font-size:13px;color:var(--muted);font-weight:400;display:block}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{min-height:50px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:38px;padding:6px 12px;font-size:15px;border-radius:10px}
.btn.ghost{background:transparent}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.tiles{grid-template-columns:1fr}}
.tile{text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--card);min-height:96px;display:block;width:100%}
.tile b{display:block;font-size:18px}
.tile span{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.tile .due{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:99px}
.hero{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hero span{color:inherit;opacity:.85}
.hero .due{background:rgba(255,255,255,.22);color:inherit}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{font-size:22px;display:block;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
h2{font-size:18px;margin:0 0 8px}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{min-height:40px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:15px}
a.chip{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-right:8px}
.tag.pill{background:var(--warn-soft);color:var(--warn);padding:1px 8px;border-radius:99px;text-transform:none;letter-spacing:0}
.big{font-size:34px;font-weight:700;margin:10px 0 4px;line-height:1.15;word-break:break-word}
.sub2{color:var(--muted);font-size:18px;margin-bottom:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{min-height:54px;text-align:left;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.art{min-height:64px;font-size:22px;font-weight:700;text-align:center}
.art.der{border-bottom:4px solid #2f6fde}.art.die{border-bottom:4px solid #d9455f}.art.das{border-bottom:4px solid #2e9e5b}
input[type=text],textarea{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{font-size:14px;min-height:110px;font-family:ui-monospace,Menlo,monospace}
.fb{margin-top:14px;padding:14px;border-radius:12px}
.fb.good{background:var(--good-soft);color:var(--ink);border-left:5px solid var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--ink);border-left:5px solid var(--bad)}
.fb .ans{font-size:22px;font-weight:700}
.fb .why{margin-top:6px;font-size:15px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:2px 0 14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
table.forms{border-collapse:collapse;width:100%;margin:6px 0 4px}
table.forms td{padding:8px 6px;border-bottom:1px solid var(--line);font-size:18px}
table.forms td:first-child{color:var(--muted);width:34%;font-size:15px}
table.forms tr.hl td{background:var(--accent-soft)}
.irr{color:var(--irr);font-weight:700}
.vlist{display:grid;gap:8px;margin-top:8px}
.vitem{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);min-height:50px}
.vitem small{color:var(--muted)}
.sand{font-family:ui-monospace,Menlo,monospace;font-size:15px;background:var(--bg);border-radius:10px;padding:10px;overflow-x:auto;white-space:pre}
.note{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:14px}
.boxes{display:flex;gap:6px;align-items:flex-end;height:90px;margin:10px 0 4px}
.boxes div{flex:1;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px;position:relative}
.boxes div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
.boxlab{display:flex;gap:6px}.boxlab span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
input[type=search]{width:100%;font:inherit;font-size:18px;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.lessonrow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}
.lessonrow .bar{flex:1;margin:0}
.lessonrow span:first-child{width:46%;color:var(--muted)}
.slots{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;padding:8px;border:2px dashed var(--line);border-radius:14px;margin:10px 0}
.slotwrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.slotno{font-size:12px;font-weight:700;color:var(--muted)}
.slotno.vs{color:var(--accent)}
.blk{min-height:46px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:19px;font-weight:600}
.blk.placed{background:var(--accent-soft);border-color:var(--accent)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px;min-height:50px}
.seatrow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px}
.cell b{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;font-weight:600}
.cell.fin b{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cell.last b{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.cell i{font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.cell.fin i{color:var(--accent)}.cell.last i{color:var(--warn)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin:12px 0 4px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mtile{min-height:54px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px;text-align:left;line-height:1.25;width:100%}
.mtile.sel{border-color:var(--accent);background:var(--accent-soft)}
.mtile.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
.mtile.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.mtile .lsn{font-size:16px;font-weight:600}
</style>
</head>

:"Nominativ / Akkusativ","q":"Wer ist das? Das ist ___ Mann von Anna. (der Mann)","a":"der","opts":["der","den","dem"],"why":"After sein the noun is nominative: der Mann.","id":"g010"},{"cat":"Nominativ / Akkusativ","q":"Which words tell you it is the accusative object?","a":"Wen oder was?","opts":["Wen oder was?","Wer oder was?","Wem?"],"why":"Accusative answers 'wen oder was?' (whom or what?).","id":"g011"},{"cat":"Dativ","q":"Ich fahre mit ___ Bus. (der Bus)","a":"dem","opts":["dem","den","der"],"why":"mit always takes the dative; masculine der becomes dem.","id":"g012"},{"cat":"Dativ","q":"Ich komme aus ___ Schweiz. (die Schweiz)","a":"der","opts":["der","die","dem"],"why":"aus + dative; feminine die becomes der.","id":"g013"},{"cat":"Dativ","q":"Er wohnt bei ___ Eltern. (die Eltern)","a":"den","opts":["den","die","der"],"why":"bei + dative; plural die becomes den.","id":"g014"},{"cat":"Dativ","q":"Nach ___ Arbeit gehe ich zum Sport. (die Arbeit)","a":"der","opts":["der","die","dem"],"why":"nach + dative; feminine: der.","id":"g015"},{"cat":"Dativ","q":"Ich fahre zu ___ Bahnhof. (der Bahnhof)","a":"dem","opts":["dem","den","der"],"why":"zu + dative; masculine: dem (zu dem = zum).","id":"g016"},{"cat":"Dativ","q":"Das Geschenk ist von ___ Mutter. (die Mutter)","a":"der","opts":["der","die","den"],"why":"von + dative; feminine: der.","id":"g017"},{"cat":"Dativ","q":"Seit ___ Jahr wohne ich hier. (ein Jahr)","a":"einem","opts":["einem","ein","einen"],"why":"seit + dative; neuter ein becomes einem.","id":"g018"},{"cat":"Dativ","q":"Which words tell you it is the dative?","a":"Wem?","opts":["Wem?","Wen?","Wer?"],"why":"The dative answers 'wem?' (to whom?).","id":"g019"},{"cat":"Präpositionen","q":"Which case follows 'für'?","a":"Akkusativ","opts":["Akkusativ","Dativ","Genitiv"],"why":"Always accusative: bis, durch, für, gegen, ohne, um (FUDGO).","id":"g020"},{"cat":"Präpositionen","q":"Which case follows 'durch'?","a":"Akkusativ","opts":["Akkusativ","Dativ","Genitiv"],"why":"Always accusative: bis, durch, für, gegen, ohne, um (FUDGO).","id":"g021"},{"cat":"Präpositionen","q":"Which case follows 'gegen'?","a":"Akkusativ","opts":["Akkusativ","Dativ","Genitiv"],"why":"Always accusative: bis, durch, für, gegen, ohne, um (FUDGO).","id":"g022"},{"cat":"Präpositionen","q":"Which case follows 'ohne'?","a":"Akkusativ","opts":["Akkusativ","Dativ","Genitiv"],"why":"Always accusative: bis, durch, für, gegen, ohne, um (FUDGO).","id":"g023"},{"cat":"Präpositionen","q":"Which case follows 'um'?","a":"Akkusativ","opts":["Akkusativ","Dativ","Genitiv"],"why":"Always accusative: bis, durch, für, gegen, ohne, um (FUDGO).","id":"g024"},{"cat":"Präpositionen","q":"Which case follows 'bis'?","a":"Akkusativ","opts":["Akkusativ","Dativ","Genitiv"],"why":"Always accusative: bis, durch, für, gegen, ohne, um (FUDGO).","id":"g025"},{"cat":"Präpositionen","q":"Which case follows 'mit'?","a":"Dativ","opts":["Dativ","Akkusativ","Genitiv"],"why":"Always dative: aus, bei, mit, nach, seit, von, zu.","id":"g026"},{"cat":"Präpositionen","q":"Which case follows 'bei'?","a":"Dativ","opts":["Dativ","Akkusativ","Genitiv"],"why":"Always dative: aus, bei, mit, nach, seit, von, zu.","id":"g027"},{"cat":"Präpositionen","q":"Which case follows 'aus'?","a":"Dativ","opts":["Dativ","Akkusativ","Genitiv"],"why":"Always dative: aus, bei, mit, nach, seit, von, zu.","id":"g028"},{"cat":"Präpositionen","q":"Which case follows 'nach'?","a":"Dativ","opts":["Dativ","Akkusativ","Genitiv"],"why":"Always dative: aus, bei, mit, nach, seit, von, zu.","id":"g029"},{"cat":"Präpositionen","q":"Which case follows 'seit'?","a":"Dativ","opts":["Dativ","Akkusativ","Genitiv"],"why":"Always dative: aus, bei, mit, nach, seit, von, zu.","id":"g030"},{"cat":"Präpositionen","q":"Which case follows 'von'?","a":"Dativ","opts":["Dativ","Akkusativ","Genitiv"],"why":"Always dative: aus, bei, mit, nach, seit, von, zu.","id":"g031"},{"cat":"Präpositionen","q":"Which case follows 'zu'?","a":"Dativ","opts":["Dativ","Akkusativ","Genitiv"],"why":"Always dative: aus, bei, mit, nach, seit, von, zu.","id":"g032"},{"cat":"Präpositionen","q":"Ich gehe in ___ Schule. (die Schule, wohin?)","a":"die","opts":["die","der","dem"],"why":"in + movement (wohin?) = accusative: die.","id":"g033"},{"cat":"Präpositionen","q":"Ich bin in ___ Schule. (die Schule, wo?)","a":"der","opts":["der","die","den"],"why":"in + location (wo?) = dative: der.","id":"g034"},{"cat":"Präpositionen","q":"Das Buch liegt auf ___ Tisch. (der Tisch, wo?)","a":"dem","opts":["dem","den","der"],"why":"Location (wo?) = dative: dem.","id":"g035"},{"cat":"Präpositionen","q":"Ich lege das Buch auf ___ Tisch. (der Tisch, wohin?)","a":"den","opts":["den","dem","der"],"why":"Movement (wohin?) = accusative: den.","id":"g036"},{"cat":"Präpositionen","q":"Die Lampe hängt über ___ Tisch. (der Tisch)","a":"dem","opts":["dem","den","der"],"why":"hängen (state, wo?) + über = dative.","id":"g037"},{"cat":"Präpositionen","q":"Ich stelle die Flasche neben ___ Glas. (das Glas)","a":"das","opts":["das","dem","der"],"why":"stellen = movement (wohin?) = accusative: das.","id":"g038"},{"cat":"Präpositionen","q":"Der Hund liegt unter ___ Bett. (das Bett)","a":"dem","opts":["dem","das","den"],"why":"liegen = location (wo?) = dative: dem.","id":"g039"},{"cat":"Präpositionen","q":"Wir fahren in ___ Stadt. (die Stadt)","a":"die","opts":["die","der","dem"],"why":"fahren in = movement = accusative: die.","id":"g040"},{"cat":"Präpositionen","q":"Ich warte an ___ Haltestelle. (die Haltestelle)","a":"der","opts":["der","die","dem"],"why":"warten = location = dative: der.","id":"g041"},{"cat":"Präpositionen","q":"Er hängt das Bild an ___ Wand. (die Wand)","a":"die","opts":["die","der","den"],"why":"hängen (transitive, he hangs it up) = movement = accusative.","id":"g042"},{"cat":"Präpositionen","q":"'Wohin?' asks for which case with two-way prepositions?","a":"Akkusativ","opts":["Akkusativ","Dativ","Genitiv"],"why":"Wohin? (movement) = Akkusativ. Wo? (place) = Dativ.","id":"g043"},{"cat":"Wortstellung & Modalverben","q":"Which sentence is correct?","a":"Ich kann gut schwimmen.","opts":["Ich kann gut schwimmen.","Ich schwimmen kann gut.","Ich kann schwimmen gut."],"why":"The modal is in position 2, the infinitive goes to the end.","id":"g044"},{"cat":"Wortstellung & Modalverben","q":"Which sentence is correct?","a":"Morgen gehe ich ins Kino.","opts":["Morgen gehe ich ins Kino.","Morgen ich gehe ins Kino.","Morgen ich ins Kino gehe."],"why":"The conjugated verb is always in position 2, even after 'Morgen'.","id":"g045"},{"cat":"Wortstellung & Modalverben","q":"Which is a correct yes/no question?","a":"Kommst du aus Spanien?","opts":["Kommst du aus Spanien?","Du kommst aus Spanien?","Kommst aus Spanien du?"],"why":"Ja/Nein-Fragen start with the verb.","id":"g046"},{"cat":"Wortstellung & Modalverben","q":"Was ___ du? (machen)","a":"machst","opts":["machst","machen","macht"],"why":"du + verb stem + -st.","id":"g047"},{"cat":"Wortstellung & Modalverben","q":"Er ___ heute arbeiten. (müssen)","a":"muss","opts":["muss","müsst","müssen"],"why":"Modal verbs: er/sie/es has no ending: er muss.","id":"g048"},{"cat":"Wortstellung & Modalverben","q":"Wir ___ Kaffee trinken. (wollen)","a":"wollen","opts":["wollen","will","wollt"],"why":"wir + infinitive form: wir wollen.","id":"g049"},{"cat":"Wortstellung & Modalverben","q":"Ich ___ Pizza. (mögen)","a":"mag","opts":["mag","mage","mögen"],"why":"mögen: ich mag, du magst, er mag.","id":"g050"},{"cat":"Wortstellung & Modalverben","q":"Du ___ hier nicht rauchen. (dürfen)","a":"darfst","opts":["darfst","dürfst","darf"],"why":"dürfen: ich darf, du darfst, er darf.","id":"g051"},{"cat":"Wortstellung & Modalverben","q":"Which sentence is correct?","a":"Ich stehe um sieben Uhr auf.","opts":["Ich stehe um sieben Uhr auf.","Ich aufstehe um sieben Uhr.","Ich stehe auf um sieben Uhr."],"why":"Separable verbs: the prefix goes to the end of the sentence.","id":"g052"},{"cat":"Wortstellung & Modalverben","q":"Which sentence is correct?","a":"Ich mache den Computer an.","opts":["Ich mache den Computer an.","Ich anmache den Computer.","Ich mache an den Computer."],"why":"anmachen is separable: an goes to the end.","id":"g053"},{"cat":"Wortstellung & Modalverben","q":"Where does 'nicht' usually go with a verb like schwimmen?","a":"Ich schwimme nicht gern.","opts":["Ich schwimme nicht gern.","Ich nicht schwimme gern.","Nicht ich schwimme gern."],"why":"nicht comes after the conjugated verb: Ich schwimme nicht gern.","id":"g054"},{"cat":"Wortstellung & Modalverben","q":"Which answer is right? 'Haben Sie keinen Zucker?' – ___, ich habe Zucker.","a":"Doch","opts":["Doch","Ja","Nein"],"why":"'Doch' answers a negative question with 'yes'.","id":"g055"},{"cat":"W-Fragen","q":"___ heißt du? – Jadranka.","a":"Wie","opts":["Wie","Wo","Wer"],"why":"Match the question word to what you are asking about: person, place, direction, time or thing.","id":"g056"},{"cat":"W-Fragen","q":"___ wohnst du? – In Zürich.","a":"Wo","opts":["Wo","Woher","Wohin"],"why":"Match the question word to what you are asking about: person, place, direction, time or thing.","id":"g057"},{"cat":"W-Fragen","q":"___ kommst du? – Aus Spanien.","a":"Woher","opts":["Woher","Wohin","Wo"],"why":"Match the question word to what you are asking about: person, place, direction, time or thing.","id":"g058"},{"cat":"W-Fragen","q":"___ gehst du? – Ins Kino.","a":"Wohin","opts":["Wohin","Woher","Wo"],"why":"Match the question word to what you are asking about: person, place, direction, time or thing.","id":"g059"},{"cat":"W-Fragen","q":"___ ist das? – Das ist Herr Müller.","a":"Wer","opts":["Wer","Was","Wie"],"why":"Match the question word to what you are asking about: person, place, direction, time or thing.","id":"g060"},{"cat":"W-Fragen","q":"___ machst du? – Ich koche.","a":"Was","opts":["Was","Wer","Wo"],"why":"Match the question word to what you are asking about: person, place, direction, time or thing.","id":"g061"},{"cat":"W-Fragen","q":"___ hast du Zeit? – Am Montag.","a":"Wann","opts":["Wann","Wie","Wo"],"why":"Match the question word to what you are asking about: person, place, direction, time or thing.","id":"g062"},{"cat":"W-Fragen","q":"___ Sprache sprichst du? – Deutsch.","a":"Welche","opts":["Welche","Wer","Wann"],"why":"Match the question word to what you are asking about: person, place, direction, time or thing.","id":"g063"},{"cat":"W-Fragen","q":"___ hilfst du? – Meiner Schwester.","a":"Wem","opts":["Wem","Wen","Wer"],"why":"Match the question word to what you are asking about: person, place, direction, time or thing.","id":"g064"},{"cat":"W-Fragen","q":"___ siehst du? – Den Lehrer.","a":"Wen","opts":["Wen","Wem","Wer"],"why":"Match the question word to what you are asking about: person, place, direction, time or thing.","id":"g065"},{"cat":"Imperativ","q":"gehen: du → ___!","a":"Geh","opts":["Geh","Gehe","Gehst"],"why":"du imperative: stem only (no du, no -st).","id":"g066"},{"cat":"Imperativ","q":"gehen: ihr → ___!","a":"Geht","opts":["Geht","Gehen","Gehe"],"why":"ihr imperative: same as the ihr form, without ihr.","id":"g067"},{"cat":"Imperativ","q":"gehen: Sie → ___!","a":"Gehen Sie","opts":["Gehen Sie","Geht Sie","Geh Sie"],"why":"Sie imperative: infinitive + Sie.","id":"g068"},{"cat":"Imperativ","q":"sprechen: du → ___!","a":"Sprich","opts":["Sprich","Sprech","Sprichst"],"why":"e → i verbs keep the vowel change in the du imperative: sprich!","id":"g069"},{"cat":"Imperativ","q":"fahren: du → ___!","a":"Fahr","opts":["Fahr","Fähr","Fährst"],"why":"a → ä verbs do NOT change in the imperative: fahr!","id":"g070"},{"cat":"Imperativ","q":"sein: du → ___!","a":"Sei","opts":["Sei","Bist","Bin"],"why":"sein is irregular: sei / seid / seien Sie.","id":"g071"},{"cat":"Imperativ","q":"haben: ihr → ___!","a":"Habt","opts":["Habt","Hat","Haben"],"why":"haben: hab / habt / haben Sie.","id":"g072"},{"cat":"Imperativ","q":"einkaufen: du → ___!","a":"Kauf ein","opts":["Kauf ein","Einkauf","Kaufe ein"],"why":"Separable verbs: the prefix goes to the end. Kauf ein!","id":"g073"},{"cat":"Imperativ","q":"warten: du → ___!","a":"Warte","opts":["Warte","Wart","Wartest"],"why":"Verbs with stems ending in -t or -d add an -e: warte!","id":"g074"},{"cat":"Possessivartikel","q":"Das ist ___ Tasche. (ich)","a":"meine","opts":["meine","mein","meinen"],"why":"Feminine noun: mein + -e = meine.","id":"g075"},{"cat":"Possessivartikel","q":"Das ist ___ Bruder. (du)","a":"dein","opts":["dein","deine","deinen"],"why":"Masculine nominative: dein.","id":"g076"},{"cat":"Possessivartikel","q":"Wie ist ___ Name? (formal Sie)","a":"Ihr","opts":["Ihr","Sie","Ihre"],"why":"Formal: Ihr (capital I), masculine nominative.","id":"g077"},{"cat":"Possessivartikel","q":"Wir lieben ___ Hund. (wir, der Hund)","a":"unseren","opts":["unseren","unser","unserem"],"why":"Masculine accusative: -en ending: unseren.","id":"g078"},{"cat":"Possessivartikel","q":"Er liebt ___ Familie. (er)","a":"seine","opts":["seine","sein","seinen"],"why":"Feminine noun: sein + -e.","id":"g079"},{"cat":"Possessivartikel","q":"Sie hat ___ Schlüssel vergessen. (sie, der Schlüssel)","a":"ihren","opts":["ihren","ihr","ihrem"],"why":"Masculine accusative: ihren.","id":"g080"},{"cat":"Possessivartikel","q":"Ich besuche ___ Eltern. (ich, plural)","a":"meine","opts":["meine","mein","meinen"],"why":"Plural nominative/accusative: meine.","id":"g081"},{"cat":"Possessivartikel","q":"Das ist ___ Auto. (wir, das Auto)","a":"unser","opts":["unser","unsere","unseren"],"why":"Neuter nominative: unser.","id":"g082"},{"cat":"Zeit-Präpositionen","q":"___ Sommer fahre ich nach Spanien.","a":"Im","opts":["Im","Am","Um"],"why":"Months and seasons: im.","id":"g083"},{"cat":"Zeit-Präpositionen","q":"___ Montag habe ich frei.","a":"Am","opts":["Am","Im","Um"],"why":"Days and parts of the day: am.","id":"g084"},{"cat":"Zeit-Präpositionen","q":"Der Kurs beginnt ___ 9 Uhr.","a":"um","opts":["um","am","im"],"why":"Clock time: um.","id":"g085"},{"cat":"Zeit-Präpositionen","q":"___ Wochenende fahre ich nach Madrid.","a":"Am","opts":["Am","Im","Um"],"why":"Wochenende takes am.","id":"g086"},{"cat":"Zeit-Präpositionen","q":"Ich lerne ___ Abend Deutsch.","a":"am","opts":["am","im","um"],"why":"am Abend / am Morgen / am Nachmittag.","id":"g087"},{"cat":"Zeit-Präpositionen","q":"___ Januar ist es kalt.","a":"Im","opts":["Im","Am","Um"],"why":"Months: im.","id":"g088"},{"cat":"Zeit-Präpositionen","q":"Ich schlafe ___ Nacht.","a":"in der","opts":["in der","am","im"],"why":"Exception: in der Nacht.","id":"g089"},{"cat":"Zeit-Präpositionen","q":"___ Frühling blühen die Blumen.","a":"Im","opts":["Im","Am","Um"],"why":"Seasons: im.","id":"g090"},{"cat":"Perfekt","q":"Ich ___ gestern Pizza gegessen.","a":"habe","opts":["habe","bin","hat"],"why":"essen takes haben.","id":"g091"},{"cat":"Perfekt","q":"Wir ___ nach Madrid geflogen.","a":"sind","opts":["sind","haben","hat"],"why":"fliegen = movement A to B → sein.","id":"g092"},{"cat":"Perfekt","q":"Partizip II of 'machen':","a":"gemacht","opts":["gemacht","gemachen","gemachet"],"why":"Regular verbs: ge + stem + -t.","id":"g093"},{"cat":"Perfekt","q":"Partizip II of 'trinken':","a":"getrunken","opts":["getrunken","getrinkt","getrinken"],"why":"Irregular verb: learn it as a pair, trinken – getrunken.","id":"g094"},{"cat":"Perfekt","q":"Partizip II of 'ankommen':","a":"angekommen","opts":["angekommen","geankommen","ankommt"],"why":"Separable: ge goes in the middle.","id":"g095"},{"cat":"Perfekt","q":"Partizip II of 'einkaufen':","a":"eingekauft","opts":["eingekauft","geeinkauft","einkaufgt"],"why":"Separable regular: ein + ge + kauft.","id":"g096"},{"cat":"Perfekt","q":"Partizip II of 'telefonieren':","a":"telefoniert","opts":["telefoniert","getelefoniert","telefonieret"],"why":"Verbs ending in -ieren have no ge-.","id":"g097"},{"cat":"Perfekt","q":"Partizip II of 'verstehen':","a":"verstanden","opts":["verstanden","geverstanden","verstehen"],"why":"Verbs starting with ver-, be-, ent-, er- have no ge-.","id":"g098"},{"cat":"Perfekt","q":"Partizip II of 'besuchen':","a":"besucht","opts":["besucht","gebesucht","besuchen"],"why":"be- prefix: no ge-.","id":"g099"},{"cat":"Perfekt","q":"Partizip II of 'bleiben':","a":"geblieben","opts":["geblieben","gebleibt","gebleiben"],"why":"bleiben – geblieben (sein).","id":"g100"},{"cat":"Perfekt","q":"Partizip II of 'gewinnen':","a":"gewonnen","opts":["gewonnen","gewinnt","gegewonnen"],"why":"gewinnen – gewonnen (begins with ge-, so no extra ge).","id":"g101"},{"cat":"Perfekt","q":"Which helper? 'aufstehen'","a":"sein","opts":["sein","haben"],"why":"Change of state / movement → sein.","id":"g102"},{"cat":"Perfekt","q":"Which helper? 'schlafen'","a":"haben","opts":["haben","sein"],"why":"No movement or change → haben.","id":"g103"},{"cat":"Perfekt","q":"Which helper? 'bleiben'","a":"sein","opts":["sein","haben"],"why":"bleiben is one of the sein exceptions.","id":"g104"},{"cat":"Perfekt","q":"Which helper? 'kochen'","a":"haben","opts":["haben","sein"],"why":"kochen takes haben.","id":"g105"},{"cat":"Perfekt","q":"Which helper? 'fahren' (to Zürich)","a":"sein","opts":["sein","haben"],"why":"Movement to a place → sein.","id":"g106"},{"cat":"Perfekt","q":"Which sentence is correct?","a":"Gestern habe ich einen Film gesehen.","opts":["Gestern habe ich einen Film gesehen.","Gestern ich habe einen Film gesehen.","Gestern habe ich gesehen einen Film."],"why":"Helper verb in position 2, Partizip II at the end.","id":"g107"},{"cat":"Perfekt","q":"Er ___ die Stadt besucht.","a":"hat","opts":["hat","ist","hast"],"why":"besuchen takes haben.","id":"g108"},{"cat":"Perfekt","q":"Which question is correct?","a":"Hast du als Kind Comics gelesen?","opts":["Hast du als Kind Comics gelesen?","Hast du als Kind gelesen Comics?","Du hast als Kind Comics gelesen?"],"why":"Yes/no question: helper first, Partizip II at the end.","id":"g109"},{"cat":"war / hatte","q":"Als Kind ___ ich oft draußen.","a":"war","opts":["war","hatte","wart"],"why":"sein → war, haben → hatte (ich/er: no ending; du: -st; wir/sie: -n; ihr: -t).","id":"g110"},{"cat":"war / hatte","q":"Wir ___ keine Zeit.","a":"hatten","opts":["hatten","waren","hatte"],"why":"sein → war, haben → hatte (ich/er: no ending; du: -st; wir/sie: -n; ihr: -t).","id":"g111"},{"cat":"war / hatte","q":"___ du früher einen Hund?","a":"Hattest","opts":["Hattest","Warst","Hatte"],"why":"sein → war, haben → hatte (ich/er: no ending; du: -st; wir/sie: -n; ihr: -t).","id":"g112"},{"cat":"war / hatte","q":"Er ___ gestern müde.","a":"war","opts":["war","hatte","waren"],"why":"sein → war, haben → hatte (ich/er: no ending; du: -st; wir/sie: -n; ihr: -t).","id":"g113"},{"cat":"war / hatte","q":"Ihr ___ im Urlaub.","a":"wart","opts":["wart","waren","war"],"why":"sein → war, haben → hatte (ich/er: no ending; du: -st; wir/sie: -n; ihr: -t).","id":"g114"},{"cat":"war / hatte","q":"Sie ___ ein Eiscafé. (sie = she)","a":"hatte","opts":["hatte","war","hatten"],"why":"sein → war, haben → hatte (ich/er: no ending; du: -st; wir/sie: -n; ihr: -t).","id":"g115"},{"cat":"war / hatte","q":"Meine Eltern ___ ein kleines Haus.","a":"hatten","opts":["hatten","hatte","waren"],"why":"sein → war, haben → hatte (ich/er: no ending; du: -st; wir/sie: -n; ihr: -t).","id":"g116"},{"cat":"war / hatte","q":"Wo ___ du gestern?","a":"warst","opts":["warst","wart","war"],"why":"sein → war, haben → hatte (ich/er: no ending; du: -st; wir/sie: -n; ihr: -t).","id":"g117"},{"cat":"Zeitangaben","q":"Ich war letzt___ Woche in Madrid. (die Woche)","a":"e","opts":["e","en","es"],"why":"die → -e: letzte Woche.","id":"g118"},{"cat":"Zeitangaben","q":"Wir fahren nächst___ Monat nach Luzern. (der Monat)","a":"en","opts":["en","e","es"],"why":"der → -en in the accusative time expression: nächsten Monat.","id":"g119"},{"cat":"Zeitangaben","q":"Ich lerne jed___ Tag Deutsch. (der Tag)","a":"en","opts":["en","e","es"],"why":"der → -en: jeden Tag.","id":"g120"},{"cat":"Zeitangaben","q":"Sie hat letzt___ Jahr ihr Jubiläum gefeiert. (das Jahr)","a":"es","opts":["es","e","en"],"why":"das → -es: letztes Jahr.","id":"g121"},{"cat":"Zeitangaben","q":"Ich rufe meine Eltern jed___ Woche an. (die Woche)","a":"e","opts":["e","en","es"],"why":"die → -e: jede Woche.","id":"g122"},{"cat":"Zeitangaben","q":"Nächst___ Sommer fliege ich nach Spanien. (der Sommer)","a":"en","opts":["en","e","es"],"why":"der → -en: nächsten Sommer.","id":"g123"},{"cat":"Zeitangaben","q":"Was machst du nächst___ Wochenende? (das Wochenende)","a":"es","opts":["es","e","en"],"why":"das → -es: nächstes Wochenende.","id":"g124"},{"cat":"der / die / das Regeln","q":"Nouns ending in -ung are usually …","a":"die","opts":["die","der","das"],"why":"-ung → die (die Zeitung, die Wohnung).","id":"g125"},{"cat":"der / die / das Regeln","q":"Nouns ending in -heit and -keit are …","a":"die","opts":["die","der","das"],"why":"-heit / -keit → die.","id":"g126"},{"cat":"der / die / das Regeln","q":"Nouns ending in -chen are …","a":"das","opts":["das","der","die"],"why":"-chen → das (das Mädchen). Diminutives are always neuter.","id":"g127"},{"cat":"der / die / das Regeln","q":"Nouns ending in -um are usually …","a":"das","opts":["das","der","die"],"why":"-um → das (das Museum).","id":"g128"},{"cat":"der / die / das Regeln","q":"Days, months and seasons are …","a":"der","opts":["der","die","das"],"why":"Always der: der Montag, der Mai, der Sommer.","id":"g129"},{"cat":"der / die / das Regeln","q":"Nouns ending in -ion and -tät are …","a":"die","opts":["die","der","das"],"why":"-ion / -tät → die (die Information, die Universität).","id":"g130"},{"cat":"der / die / das Regeln","q":"Nouns ending in -schaft are …","a":"die","opts":["die","der","das"],"why":"-schaft → die (die Freundschaft).","id":"g131"},{"cat":"der / die / das Regeln","q":"Nouns ending in -ment are usually …","a":"das","opts":["das","der","die"],"why":"-ment → das (das Instrument).","id":"g132"},{"cat":"der / die / das Regeln","q":"Male persons and professions are usually …","a":"der","opts":["der","die","das"],"why":"der Mann, der Koch.","id":"g133"},{"cat":"der / die / das Regeln","q":"Nouns made from a verb infinitive (das Essen) are …","a":"das","opts":["das","der","die"],"why":"Nominalised infinitives are neuter: das Essen, das Leben.","id":"g134"},{"cat":"Adjektivendungen","q":"der ___ Mann (nett)","a":"nette","opts":["nette","netter","netten"],"why":"Nominative masculine after der: -e.","id":"g135"},{"cat":"Adjektivendungen","q":"die ___ Frau (nett)","a":"nette","opts":["nette","netten","netter"],"why":"Nominative feminine after die: -e.","id":"g136"},{"cat":"Adjektivendungen","q":"das ___ Mädchen (nett)","a":"nette","opts":["nette","nettes","netten"],"why":"Nominative neuter after das: -e.","id":"g137"},{"cat":"Adjektivendungen","q":"Ich sehe den ___ Mann. (nett)","a":"netten","opts":["netten","nette","netter"],"why":"Accusative masculine after den: -en.","id":"g138"},{"cat":"Adjektivendungen","q":"Er ist ein ___ Bruder. (klein, nominative)","a":"kleiner","opts":["kleiner","kleine","kleinen"],"why":"After ein (masculine nominative) the adjective carries the -er.","id":"g139"},{"cat":"Adjektivendungen","q":"Das ist eine ___ Katze. (klein)","a":"kleine","opts":["kleine","kleiner","kleines"],"why":"Feminine after eine: -e.","id":"g140"},{"cat":"Adjektivendungen","q":"Das ist ein ___ Kaninchen. (klein)","a":"kleines","opts":["kleines","kleine","kleiner"],"why":"Neuter after ein: -es.","id":"g141"},{"cat":"Adjektivendungen","q":"Ich habe einen ___ Bruder. (klein)","a":"kleinen","opts":["kleinen","kleiner","kleine"],"why":"Accusative masculine after einen: -en.","id":"g142"},{"cat":"Welcher Fall?","q":"Which article changes in the accusative?","a":"der → den (masculine only)","opts":["der → den (masculine only)","die → den","das → dem"],"why":"Coat check: only the masculine coat changes. Die, das and the plural stay the same.","id":"g143"},{"cat":"Welcher Fall?","q":"Which words always trigger the dative?","a":"mit, bei, aus, nach, seit, von, zu","opts":["mit, bei, aus, nach, seit, von, zu","für, durch, gegen, ohne, um","in, an, auf, über, unter"],"why":"Dative triggers: mit, bei, aus, nach, seit, von, zu.","id":"g144"},{"cat":"Welcher Fall?","q":"'Der Mann isst.' What is 'der Mann'?","a":"Subject (Nominativ)","opts":["Subject (Nominativ)","Akkusativ object","Dativ object"],"why":"It is the doer of the verb: nominative.","id":"g145"},{"cat":"Welcher Fall?","q":"'Ich kaufe den Kaffee.' What is 'den Kaffee'?","a":"Akkusativ object (wen oder was?)","opts":["Akkusativ object (wen oder was?)","Subject (Nominativ)","Dativ object (wem?)"],"why":"It is what gets bought: wen oder was? = accusative.","id":"g146"},{"cat":"Welcher Fall?","q":"'Ich helfe dem Mann.' What is 'dem Mann'?","a":"Dativ object (wem?)","opts":["Dativ object (wem?)","Akkusativ object (wen oder was?)","Subject (Nominativ)"],"why":"Wem helfe ich? Dem Mann. helfen takes the dative.","id":"g147"},{"cat":"Welcher Fall?","q":"Which sentence is correct?","a":"Ich sehe den Hund.","opts":["Ich sehe den Hund.","Ich sehe der Hund.","Ich sehe dem Hund."],"why":"sehen + accusative: masculine der becomes den.","id":"g148"},{"cat":"Welcher Fall?","q":"Which sentence is correct?","a":"Ich fahre mit dem Zug.","opts":["Ich fahre mit dem Zug.","Ich fahre mit den Zug.","Ich fahre mit der Zug."],"why":"mit + dative: der Zug becomes dem Zug.","id":"g149"},{"cat":"Welcher Fall?","q":"Which sentence is correct?","a":"Ich komme aus der Schweiz.","opts":["Ich komme aus der Schweiz.","Ich komme aus die Schweiz.","Ich komme aus dem Schweiz."],"why":"aus + dative: die Schweiz becomes der Schweiz.","id":"g150"},{"cat":"Welcher Fall?","q":"Ich schenke ___ Mutter Blumen. (die Mutter)","a":"der","opts":["der","die","den"],"why":"schenken: the person who receives is dative. die Mutter becomes der Mutter.","id":"g151"},{"cat":"Welcher Fall?","q":"Ich gebe ___ Kind einen Apfel. (das Kind)","a":"dem","opts":["dem","das","den"],"why":"geben: the receiver is dative. das Kind becomes dem Kind.","id":"g152"},{"cat":"Welcher Fall?","q":"Er hilft ___ Frau. (die Frau)","a":"der","opts":["der","die","den"],"why":"helfen takes the dative: die Frau becomes der Frau.","id":"g153"},{"cat":"Welcher Fall?","q":"Ich kenne ___ Lehrer. (der Lehrer)","a":"den","opts":["den","der","dem"],"why":"kennen + accusative: der becomes den.","id":"g154"},{"cat":"Welcher Fall?","q":"Wir besuchen ___ Großeltern. (die Großeltern)","a":"die","opts":["die","den","der"],"why":"besuchen + accusative: the plural die stays die.","id":"g155"},{"cat":"Welcher Fall?","q":"Sie wohnt bei ___ Tante. (die Tante)","a":"der","opts":["der","die","den"],"why":"bei + dative: die becomes der.","id":"g156"},{"cat":"Welcher Fall?","q":"Ich rufe ___ Chef an. (der Chef)","a":"den","opts":["den","dem","der"],"why":"anrufen + accusative: wen rufe ich an? Den Chef.","id":"g157"},{"cat":"Welcher Fall?","q":"Wir gehen zu ___ Ärztin. (die Ärztin)","a":"der","opts":["der","die","den"],"why":"zu + dative: die becomes der.","id":"g158"},{"cat":"Welcher Fall?","q":"Ich telefoniere mit ___ Bruder. (der Bruder)","a":"dem","opts":["dem","den","der"],"why":"mit + dative: der becomes dem.","id":"g159"},{"cat":"Welcher Fall?","q":"Sie kauft ___ Buch. (das Buch)","a":"das","opts":["das","dem","den"],"why":"Neuter accusative does not change: das stays das.","id":"g160"},{"cat":"Welcher Fall?","q":"Ich danke ___ Lehrerin. (die Lehrerin)","a":"der","opts":["der","die","den"],"why":"danken takes the dative: die becomes der.","id":"g161"},{"cat":"Welcher Fall?","q":"Das Geschenk ist für ___ Kind. (das Kind)","a":"das","opts":["das","dem","den"],"why":"für + accusative: das stays das.","id":"g162"},{"cat":"Welcher Fall?","q":"Wir fahren ohne ___ Auto. (das Auto)","a":"das","opts":["das","dem","den"],"why":"ohne + accusative: das stays das.","id":"g163"},{"cat":"Welcher Fall?","q":"Ich spreche mit ___ Kindern. (die Kinder)","a":"den","opts":["den","die","der"],"why":"mit + dative plural: den, and the noun gets an -n.","id":"g164"},{"cat":"Welcher Fall?","q":"Der Koffer gehört ___ Frau. (die Frau)","a":"der","opts":["der","die","den"],"why":"gehören takes the dative: die Frau becomes der Frau.","id":"g165"},{"cat":"Welcher Fall?","q":"Ich sehe ___ Frau. (die Frau)","a":"die","opts":["die","der","den"],"why":"Feminine accusative stays die.","id":"g166"},{"cat":"Welcher Fall?","q":"Ich möchte ___ Kaffee. (der Kaffee)","a":"den","opts":["den","der","dem"],"why":"möchten + accusative object: der becomes den.","id":"g167"},{"cat":"Wechselpräpositionen","q":"Ich hänge das Bild an ___ Wand. (die Wand, wohin?)","a":"die","opts":["die","der","den"],"why":"Doorway test: movement = wohin? = Akkusativ. die Wand stays die.","id":"g168"},{"cat":"Wechselpräpositionen","q":"Das Bild hängt an ___ Wand. (die Wand, wo?)","a":"der","opts":["der","die","dem"],"why":"No movement = wo? = Dativ: die becomes der.","id":"g169"},{"cat":"Wechselpräpositionen","q":"Ich stelle die Tasche unter ___ Tisch. (der Tisch, wohin?)","a":"den","opts":["den","dem","der"],"why":"wohin? = Akkusativ: der becomes den.","id":"g170"},{"cat":"Wechselpräpositionen","q":"Die Tasche steht unter ___ Tisch. (der Tisch, wo?)","a":"dem","opts":["dem","den","der"],"why":"wo? = Dativ: der becomes dem.","id":"g171"},{"cat":"Wechselpräpositionen","q":"Ich setze mich neben ___ Fenster. (das Fenster, wohin?)","a":"das","opts":["das","dem","den"],"why":"wohin? = Akkusativ: neuter das stays das.","id":"g172"},{"cat":"Wechselpräpositionen","q":"Ich sitze neben ___ Fenster. (das Fenster, wo?)","a":"dem","opts":["dem","das","den"],"why":"wo? = Dativ: das becomes dem.","id":"g173"},{"cat":"Wechselpräpositionen","q":"Wir gehen über ___ Brücke. (die Brücke, crossing it = wohin?)","a":"die","opts":["die","der","den"],"why":"Crossing = movement = Akkusativ: die stays die.","id":"g174"},{"cat":"Wechselpräpositionen","q":"Die Lampe hängt über ___ Tisch. (der Tisch, wo?)","a":"dem","opts":["dem","den","der"],"why":"wo? = Dativ: der becomes dem.","id":"g175"},{"cat":"Wechselpräpositionen","q":"Die Katze läuft hinter ___ Haus. (das Haus, wohin?)","a":"das","opts":["das","dem","der"],"why":"wohin? = Akkusativ: das stays das.","id":"g176"},{"cat":"Wechselpräpositionen","q":"Die Katze schläft hinter ___ Haus. (das Haus, wo?)","a":"dem","opts":["dem","das","der"],"why":"wo? = Dativ: das becomes dem.","id":"g177"},{"cat":"Wechselpräpositionen","q":"Stell den Wagen vor ___ Werkstatt! (die Werkstatt, wohin?)","a":"die","opts":["die","der","den"],"why":"wohin? = Akkusativ: die stays die.","id":"g178"},{"cat":"Wechselpräpositionen","q":"Der Wagen steht vor ___ Werkstatt. (die Werkstatt, wo?)","a":"der","opts":["der","die","dem"],"why":"wo? = Dativ: die becomes der.","id":"g179"},{"cat":"Wechselpräpositionen","q":"Wir stellen den Wagen zwischen ___ Bäume. (die Bäume, wohin?)","a":"die","opts":["die","den","der"],"why":"wohin? = Akkusativ plural: die stays die.","id":"g180"},{"cat":"Wechselpräpositionen","q":"Der Wagen steht zwischen ___ Bäumen. (die Bäume, wo?)","a":"den","opts":["den","die","der"],"why":"wo? = Dativ plural: die becomes den (and the noun gets -n).","id":"g181"},{"cat":"Wechselpräpositionen","q":"an, auf, hinter, in, neben, über, unter, vor, zwischen: what decides Akkusativ or Dativ?","a":"wohin? (movement) = Akk, wo? (place) = Dativ","opts":["wohin? (movement) = Akk, wo? (place) = Dativ","They are always Akkusativ","They are always Dativ"],"why":"These are the two-way (Wechsel-) prepositions: the doorway test decides the case.","id":"g182"},{"cat":"Wechselpräpositionen","q":"'Ich gehe in die Werkstatt.' Wohin oder wo?","a":"Wohin (movement) → Akkusativ","opts":["Wohin (movement) → Akkusativ","Wo (place) → Dativ"],"why":"gehen in = walking into = movement = Akkusativ.","id":"g183"},{"cat":"Wechselpräpositionen","q":"'Ich bin in der Werkstatt.' Wohin oder wo?","a":"Wo (place) → Dativ","opts":["Wo (place) → Dativ","Wohin (movement) → Akkusativ"]," function applyRemote(snap, isInitial){
  if (!snap || !snap.exists) return;
  const data = snap.data(); if (!data || typeof data.payload !== 'string') return;
  if (!isInitial && snap.metadata && snap.metadata.hasPendingWrites) return;
  if (!isInitial && data.payload === lastPushed) return;
  if (!isInitial && view === 'run') return; // never yank state out from under an active session

    if (!remote || typeof remote.cards !== 'object') return;

    memCopy = JSON.stringify(S);

function attachSync(uid){
  if (unsubSnap) { try { unsubSnap(); } catch(e) {} unsubSnap = null; }

  dbDocRef.get().then(snap => applyRemote(snap, true)).catch(() => {});
  unsubSnap = dbDocRef.onSnapshot(s => applyRemote(s, false), () => {});

/* Scope: a quick shortcut that sets S.settings.lessons to a whole group of lesson
   codes at once - "my classes" (Momente/A11/DUO material) or a CEFR level
   (A1/A2/B1) drawn from the general CORE/SWISS vocabulary pack. Reuses the exact

function scopeCodes(v){
  if (v === 'all') return [];
  if (v === 'class') return DATA.lessons.filter(l => l.class).map(l => l.code);

const tricky = v => v.vc || v.sep || v.modal || v.irr.some(Boolean);

function tensesFor(v, t){
  const out = [];
  if (t === 'pres' || t === 'mix') out.push('pres');
  if ((t === 'perf' || t === 'mix') && v.part) out.push('perf');
  if ((t === 'praet' || t === 'mix') && v.praet) out.push('praet');
  if ((t === 'imp' || t === 'mix') && v.imp) out.push('imp');

}
function pool(kind, o){
  o = o || {};
  switch (kind) {
    case 'art': return DATA.nouns.filter(lessonOK).map(n => ({id:n.id + ':a', type:'art', ref:n}));
    case 'plu': return DATA.nouns.filter(lessonOK).filter(n => n.plural !== '-' && n.plural !== 'pl').map(n => ({id:n.id + ':p', type:'plu', ref:n}));
    case 'word': return DATA.words.filter(lessonOK).map(w => ({id:w.id, type:'word', ref:w}));
    case 'verb': {
      const t = o.tense || S.settings.tense, out = [];
      DATA.verbs.filter(lessonOK).filter(v => !(o.tricky != null ? o.tricky : S.settings.tricky) || tricky(v)).forEach(v => {
        tensesFor(v, t).forEach(te => out.push({id:v.id + ':' + te, type:'verb', tense:te, ref:v, person:0}));
      });

    }
    case 'order': return DATA.sentences.filter(x => !S.settings.ocat || x.cat === S.settings.ocat).map(x => ({id:x.id, type:'ord', ref:x}));
    case 'gram': return DATA.grammar.filter(q => !S.settings.gcat || q.cat === S.settings.gcat).map(q => ({id:'gq:' + q.id, type:'gram', ref:q}));

}

  return {art:pool('art'), plu:pool('plu'), word:pool('word'), verb:pool('verb', {tense:'mix', tricky:S.settings.tricky}), order:pool('order'), gram:pool('gram')};
}
function split(items){
  const day = dayNum(), due = [], fresh = [];
  items.forEach(it => { const c = S.cards[it.id]; if (!c || !c.n) fresh.push(it); else if (c.due <= day) due.push(it); });
  due.sort((a, b) => S.cards[a.id].due - S.cards[b.id].due);
  return {due, fresh};
}
function buildQueue(items, size){
  const {due, fresh} = split(items);
  let q = due.slice(0, size);
  q = q.concat(fresh.slice(0, Math.max(0, size - q.length)));
  return shuffle(q);
}
function buildMix(size){
  // Round-robin BOTH the due and the fresh portions across every pool, so
  // one type (say, a backlog of overdue verbs) can never crowd out the rest
  // of a "Daily mix" session - every section gets a fair turn.
  const P = allPoolsForMix(), keys = Object.keys(P);
  const dueByKey = {}, freshByKey = {};
  keys.forEach(k => { const s = split(P[k]); dueByKey[k] = s.due.slice(); freshByKey[k] = s.fresh.slice(); });
  let q = [], idx = 0, added = 0;
  while (added < size && keys.some(k => dueByKey[k].length)) {
    const k = keys[idx % keys.length]; idx++;
    if (dueByKey[k].length) { q.push(dueByKey[k].shift()); added++; }
  }
  const newCap = Math.max(0, size - q.length);
  added = 0; idx = 0;
  while (added < newCap && keys.some(k => freshByKey[k].length)) {
    const k = keys[idx % keys.length]; idx++;
    if (freshByKey[k].length) { q.push(freshByKey[k].shift()); added++; }

}

function prep(items){ // per-item random details
  return items.map(it => {
    const x = Object.assign({}, it);
    if (x.type === 'verb') x.person = Math.floor(Math.random() * (x.tense === 'imp' ? 3 : 6));
    if (x.type === 'ord') {

}

// iOS has a long-standing bug where speechSynthesis stays silent inside a
// home-screen-installed app (it works fine in a normal Safari tab) unless the
// device's audio session is "unlocked" by playing something - any audio
// element - during the very first tap. This primes it as early as possible
// (the first tap anywhere, not just on a Listen button) so it's ready by the
// time one is pressed. It's a real iOS limitation, not fully fixable from
// script - if it's still silent afterwards, the phone's physical silent/mute
// switch is the next thing to check (speechSynthesis respects it).
let audioUnlocked = false;
function unlockAudio(){
  if (audioUnlocked) return;
  audioUnlocked = true;
  try {
    const a = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');
    a.play().catch(() => {});
  } catch(e) {}
  try {
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(' '); u.volume = 0;
      speechSynthesis.speak(u);
    }
  } catch(e) {}
}
document.addEventListener('touchend', unlockAudio, {once:true, capture:true});

function speak(text){
  try {
    if (!('speechSynthesis' in window)) return;
    unlockAudio();
    if (speechSynthesis.paused) speechSynthesis.resume();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE'; u.rate = .9;
    const vs = speechSynthesis.getVoices().filter(v => /^de/i.test(v.lang));
    if (vs.length) u.voice = vs[0];
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch(e) {}
}

function makeBatches(list){
  const bs = [];
  for (let i = 0; i < list.length; i += 6) bs.push(list.slice(i, i + 6));
  return bs.map(pairs => {
    let dir = S.settings.wdir || 'de';
    if (S.settings.listen) dir = 'de';
    else if (dir === 'mix') dir = Math.random() < .5 ? 'de' : 'en';
    return {pairs, dir, listen: !!S.settings.listen};
  });
}
function initBatch(){
  const b = run.batches[run.bi];
  run.curBatch = {
    pairs: b.pairs, dir: b.dir, listen: b.listen,
    leftOrder: shuffle(b.pairs.map((_, i) => i)),
    rightOrder: shuffle(b.pairs.map((_, i) => i)),
    matched: new Set(), guessed: new Set(),
    sel: null, flash: null
  };
}

function startRun(){
  const size = S.settings.size;
  if (mode === 'word') {
    let batches = makeBatches(buildQueue(pool('word'), size));
    let n = batches.reduce((s, b) => s + b.pairs.length, 0);
    if (!n) { batches = makeBatches(shuffle(pool('word')).slice(0, size)); n = batches.reduce((s, b) => s + b.pairs.length, 0); }
    run = {mode:'word', batches, bi:0, n, score:0, total:0, missed:[]};
    initBatch(); view = 'run'; render(); return;
  }
  let items = mode === 'mix' ? buildMix(size) : buildQueue(itemsFor(mode), size);
  if (!items.length) { // extra practice
    const all = mode === 'mix' ? [].concat.apply([], Object.values(allPoolsForMix())) : itemsFor(mode);
    items = shuffle(all).slice(0, size);
  }
  items = prep(items);
  run = {items, n:items.length, i:0, score:0, total:0, missed:[], answered:false, revealed:false, picked:null, given:'', lastOk:false, used:[]};
  view = 'run'; render();
}
