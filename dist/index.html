  if (!it.retry) {
    grade(it.id, ok); run.total++;
    if (ok) run.score++; else {
      run.missed.push(it);
      const again = Object.assign({}, it, {retry:true});
      if (again.type === 'verb') again.person = Math.floor(Math.random() * (again.tense === 'imp' ? 3 : 6));
      run.items.push(again);
    }
    save();
  }
  render();
}

/* ---------- item views ---------- */
function nounFull(n){
  const pl = n.plural === '-' ? 'no plural' : n.plural === 'pl' ? 'plural only' : 'Pl.: die ' + n.plural;
  return `${esc(n.art)} ${esc(n.word)} <span class="muted" style="font-size:16px;font-weight:400">&middot; ${esc(pl)}</span>`;
}
function verbAsk(it){
  const v = it.ref, p = it.person;
  let expected, label, sentence;
  if (it.tense === 'pres') { expected = v.forms[p]; label = PERS[p]; sentence = SAYPERS[p] + ' ' + expected; }
  else if (it.tense === 'perf') { expected = AUX[v.aux][p] + ' ' + v.part; label = PERS[p]; sentence = SAYPERS[p] + ' ' + expected; }
  else if (it.tense === 'praet') { expected = v.praet[p]; label = PERS[p]; sentence = SAYPERS[p] + ' ' + expected; }
  else { expected = v.imp[p]; label = IMPP[p]; sentence = expected; }
  return {expected, label, sentence};
}
function verbTable(it){
  const v = it.ref; let rows = '';
  const src = it.tense === 'pres' ? v.forms.map((f, i) => [PERS[i], f, v.irr[i]])
    : it.tense === 'perf' ? AUX[v.aux].map((a, i) => [PERS[i], a + ' ' + v.part, false])
    : it.tense === 'praet' ? v.praet.map((f, i) => [PERS[i], f, false])
    : v.imp.map((f, i) => [IMPP[i], f, false]);
  src.forEach((r, i) => { rows += `<tr class="${i === it.person ? 'hl' : ''}"><td>${esc(r[0])}</td><td class="${r[2] ? 'irr' : ''}">${esc(r[1])}</td></tr>`; });
  return `<table class="forms">${rows}</table>`;
}
function feedback(it){
  const ok = run.lastOk; let h = `<div class="fb ${ok ? 'good' : 'bad'}">`;
  if (it.type === 'art') {
    const n = it.ref; h += `<div class="ans">${ok ? 'Richtig!' : 'Not quite.'} ${nounFull(n)}</div>`;
    if (n.hint) h += `<div class="why">Tip: ${esc(n.hint)}.</div>`;
    h += `<div style="margin-top:8px">${spk(n.art + ' ' + n.word)}</div>`;
  } else if (it.type === 'plu') {
    const n = it.ref; h += `<div class="ans">${ok ? 'Richtig!' : 'Correct plural:'} die ${esc(n.plural)}</div>`;
    if (!ok && run.given) h += `<div class="why">You typed: ${esc(run.given)}</div>`;
    h += `<div style="margin-top:8px">${spk('die ' + n.plural)}</div>`;
  } else if (it.type === 'verb') {
    const a = verbAsk(it); h += `<div class="ans">${ok ? 'Richtig!' : 'Correct:'} ${esc(a.sentence)}</div>`;
    if (!ok && run.given) h += `<div class="why">You typed: ${esc(run.given)}</div>`;
    if (!ok && it.tense === 'perf') h += `<div class="why">Sandwich: helper in slot 2, Partizip II at the end.</div>`;
    if (!ok && it.ref.sep && it.tense !== 'perf') h += `<div class="why">Separable verb: the prefix &ldquo;${esc(it.ref.sep)}&rdquo; jumps to the end.</div>`;
    h += verbTable(it) + spk(a.sentence.replace(/!$/, ''));
  } else if (it.type === 'ord') {
    const r = it.ref, cat = OCAT[r.cat] || {tip:''};
    h += `<div class="ans">${ok ? 'Richtig!' : 'Not quite.'}</div>` + seats(r.alts[0], r.cat);
    h += `<div class="why">${esc(sentence(r.alts[0], r.p))}</div>`;
    if (r.alts.length > 1) h += `<div class="why">Also correct: ${r.alts.slice(1).map(a => esc(sentence(a, r.p))).join(' &middot; ')}</div>`;
    if (!ok && run.given) h += `<div class="why">You built: ${esc(run.given)}</div>`;
    h += `<div class="why"><b>Rule:</b> ${esc(cat.tip)}</div>`;
    if (!ok) h += `<div class="why muted">Other orders can exist, but this is the most natural one.</div>`;
    h += `<div style="margin-top:8px">${spk(sentence(r.alts[0], r.p).replace(/[.?!]$/, ''))}</div>`;
  } else if (it.type === 'word') {
    const w = it.ref; h += `<div class="ans">${ok ? 'Richtig!' : 'Correct:'} ${esc(w.de)} = ${esc(w.en)}</div>`;
    h += `<div style="margin-top:8px">${spk(w.de)}</div>`;
  } else if (it.type === 'gram') {
    h += `<div class="ans">${ok ? 'Richtig!' : 'Correct: ' + esc(it.ref.a)}</div><div class="why">${esc(it.ref.why)}</div>`;
    if (!ok && CASECATS.indexOf(it.ref.cat) >= 0) h += `<div class="why"><b>Coat check:</b> 1) the doer? Nominative, no change. 2) wen oder was? Only der becomes den. 3) after mit, bei, aus, nach, seit, von, zu: dem / der / dem / den.</div>`;
    if (!ok && DOORCATS.indexOf(it.ref.cat) >= 0) h += `<div class="why"><b>Doorway test:</b> moving through/into = wohin? = Akkusativ. Already there, staying put = wo? = Dativ.</div>`;
  }
  return h + '</div>';
}

function seats(alt, cat){
  let h = '<div class="seatrow">';
  alt.forEach((c, i) => {
    const m = chunkM(c);
    const lab = m === 'fin' ? 'seat ' + (i + 1) + ' · verb' : m === 'last' ? (cat === 'sub' ? 'last wagon' : 'last seat') : (cat === 'sub' && i > 1 ? '' : 'seat ' + (i + 1));
    h += `<div class="cell ${m}"><i>${lab || '&nbsp;'}</i><b>${esc(i === 0 ? cap1(chunkT(c)) : chunkT(c))}</b></div>`;
  });
  return h + '</div>';
}

function matchRunView(){
  const cb = run.curBatch; if (!cb) return '';
  const pct = Math.round(100 * Math.min(run.total, run.n) / Math.max(1, run.n));
  let h = `<div class="flex" style="margin-bottom:6px"><span class="muted">${Math.min(run.total, run.n)} / ${run.n}</span><span class="spacer"></span><button class="btn small ghost" data-act="quit">End session</button></div><div class="bar"><i style="width:${pct}%"></i></div><div class="card">`;
  h += `<span class="tag">Match</span><span class="tag">${cb.dir === 'de' ? (cb.listen ? 'Listen · German → English' : 'German → English') : 'English → German'}</span>`;
  h += `<div class="sub2" style="margin-top:6px;font-size:16px">${cb.listen ? 'Tap a card to hear it, then tap its English meaning.' : 'Tap one card, then its match.'}</div>`;
  h += '<div class="mgrid"><div class="mcol">';
  cb.leftOrder.forEach(pi => {
    const w = cb.pairs[pi].ref, matched = cb.matched.has(pi);
    const isFlashL = cb.flash && cb.flash.l === pi;
    let cls = 'mtile' + (matched ? ' ok' : '') + (cb.sel && cb.sel.side === 'l' && cb.sel.pi === pi ? ' sel' : '') + (isFlashL ? ' bad' : '');
    const showText = cb.dir === 'de' ? w.de : w.en;
    const content = (cb.listen && cb.dir === 'de' && !matched) ? '<span class="lsn">&#9654;&#65039; Listen</span>' : esc(showText);
    h += `<button class="${cls}" data-act="mtap" data-side="l" data-pi="${pi}" ${matched ? 'disabled' : ''}>${content}</button>`;
  });
  h += '</div><div class="mcol">';
  cb.rightOrder.forEach(pi => {
    const w = cb.pairs[pi].ref, matched = cb.matched.has(pi);
    const isFlashR = cb.flash && cb.flash.r === pi;
    let cls = 'mtile' + (matched ? ' ok' : '') + (cb.sel && cb.sel.side === 'r' && cb.sel.pi === pi ? ' sel' : '') + (isFlashR ? ' bad' : '');
    const showText = cb.dir === 'de' ? w.en : w.de;
    h += `<button class="${cls}" data-act="mtap" data-side="r" data-pi="${pi}" ${matched ? 'disabled' : ''}>${esc(showText)}</button>`;
  });
  h += '</div></div>';
  if (cb.matched.size === cb.pairs.length) {
    const last = run.bi + 1 >= run.batches.length;
    h += `<div style="margin-top:14px"><button class="btn primary" data-act="matchnext" style="width:100%">${last ? 'Finish' : 'Next set'}</button></div>`;
  }
  return h + '</div>';
}

function runView(){
  if (mode === 'word') return matchRunView();
  const it = cur(); if (!it) return '';
  const pct = Math.round(100 * Math.min(run.total, run.n) / run.n);
  let h = `<div class="flex" style="margin-bottom:6px"><span class="muted">${Math.min(it.retry ? run.n : (run.answered ? run.total : run.total + 1), run.n)} / ${run.n}${it.retry ? ' &middot; retry' : ''}</span><span class="spacer"></span><button class="btn small ghost" data-act="quit">End session</button></div><div class="bar"><i style="width:${pct}%"></i></div><div class="card">`;
  if (it.type === 'art') {
    const n = it.ref;
    h += `<span class="tag">Noun</span><span class="tag">${esc((LTITLE[n.lesson] || '').split(' · ')[0])}</span><div class="big">${esc(n.word)}</div><div class="sub2">${esc(n.en)}${n.plural === 'pl' ? ' (plural)' : ''}</div><div class="row3">`;
    ['der','die','das'].forEach(a => {
      let cls = 'opt art ' + a;
      if (run.answered) { if (a === n.art) cls += ' right'; else if (a === run.picked) cls += ' wrong'; }
      h += `<button class="${cls}" data-act="pick" data-v="${a}" ${run.answered ? 'disabled' : ''}>${a}</button>`;
    });
    h += '</div>';
  } else if (it.type === 'plu') {
    const n = it.ref;
    h += `<span class="tag">Plural</span><div class="big">${esc(n.art)} ${esc(n.word)}</div><div class="sub2">${esc(n.en)}</div>${typed('die …  (type the plural)')}`;
  } else if (it.type === 'verb') {
    const a = verbAsk(it), v = it.ref;
    h += `<span class="tag">${TENSE_LAB[it.tense]}</span><span class="tag">${esc((LTITLE[v.lesson] || '').split(' · ')[0])}</span>`;
    if (v.sep) h += `<span class="tag pill">separable</span>`;
    if (v.modal) h += `<span class="tag pill">modal</span>`;
    h += `<div class="big">${esc(a.label)} &middot; ${esc(v.inf)}</div><div class="sub2">${esc(v.en)}${it.tense === 'perf' ? ' &mdash; type helper + Partizip II' : ''}</div>${typed(it.tense === 'imp' ? 'Imperative' : 'Type the form')}`;
  } else if (it.type === 'ord') {
    const r = it.ref, cat = OCAT[r.cat] || {label:'', tip:''};
    const vseat = r.alts[0].findIndex(c => c[0] === '!') + 1;
    const total = it.shuf.length, used = run.used, guide = S.settings.guide;
    h += `<span class="tag">${esc(cat.label)}</span><div class="big" style="font-size:24px">${esc(r.en)}</div><div class="sub2">Tap the blocks in the right order. The sentence ends with &ldquo;${esc(r.p)}&rdquo;.</div><div class="slots">`;
    for (let k = 0; k < total; k++) {
      const idx = used[k], isV = guide && k + 1 === vseat;
      const no = `<span class="slotno${isV ? ' vs' : ''}">${k + 1}${isV ? ' verb' : ''}</span>`;
      let btn;
      if (idx == null) btn = `<span class="blk" style="opacity:.25;border-style:dashed">&nbsp;&nbsp;&nbsp;&nbsp;</span>`;
      else { let t = chunkT(it.shuf[idx]); if (k === 0) t = cap1(t); btn = `<button class="blk placed" data-act="unplace" data-k="${k}" ${run.answered ? 'disabled' : ''}>${esc(t)}</button>`; }
      h += `<div class="slotwrap">${no}${btn}</div>`;
    }
    h += '</div><div class="pool">';
    it.shuf.forEach((c, i) => { if (used.indexOf(i) < 0) h += `<button class="blk" data-act="place" data-i="${i}" ${run.answered ? 'disabled' : ''}>${esc(chunkT(c))}</button>`; });
    h += '</div>';
    if (!run.answered) h += `<div class="two"><button class="btn" data-act="oreset">Reset</button><button class="btn primary" data-act="check" ${used.length === total ? '' : 'disabled'}>Check</button></div>`;
  } else if (it.type === 'gram') {
    const q = it.ref;
    if (!it.order) it.order = shuffle(q.opts);
    h += `<span class="tag">${esc(q.cat)}</span><div class="big" style="font-size:24px">${esc(q.q)}</div><div class="opts">`;
    it.order.forEach(o => {
      let cls = 'opt';
      if (run.answered) { if (o === q.a) cls += ' right'; else if (o === run.picked) cls += ' wrong'; }
      h += `<button class="${cls}" data-act="mc" data-v="${esc(o)}" ${run.answered ? 'disabled' : ''}>${esc(o)}</button>`;
    });
    h += '</div>';
  } else if (it.type === 'word') {
    // Vocabulary item inside Daily mix / a single-item session (not the Match mode
    // board - that's matchRunView() above, only used when mode === 'word' itself).
    // Multiple-choice so it stays auto-graded and one-tap, like the rest of mix.
    const w = it.ref;
    if (!it.opts) {
      const distract = shuffle(DATA.words.filter(x => x.en !== w.en)).slice(0, 3).map(x => x.en);
      it.opts = shuffle([w.en].concat(distract));
    }
    h += `<span class="tag">Vocabulary</span><span class="tag">${esc((LTITLE[w.lesson] || '').split(' · ')[0])}</span><div class="big">${esc(w.de)}</div><div class="opts">`;
    it.opts.forEach(o => {
      let cls = 'opt';
      if (run.answered) { if (o === w.en) cls += ' right'; else if (o === run.picked) cls += ' wrong'; }
      h += `<button class="${cls}" data-act="mc" data-v="${esc(o)}" ${run.answered ? 'disabled' : ''}>${esc(o)}</button>`;
    });
    h += '</div>';
  }
  if (run.answered) h += feedback(it);
  if (run.answered) h += `<div style="margin-top:14px"><button class="btn primary" data-act="next" style="width:100%">${run.i + 1 >= run.items.length ? 'Finish' : 'Next'}</button></div>`;
  return h + '</div>';
}
function typed(ph){
  const dis = run.answered ? 'disabled' : '';
  let h = `<input type="text" id="ans" placeholder="${esc(ph)}" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" value="${esc(run.given)}" ${dis}>`;
  if (!run.answered) h += `<button class="btn primary" data-act="check" style="width:100%;margin-top:10px">Check</button>`;
  return h;
}

function endView(){
  const pct = run.total ? Math.round(100 * run.score / run.total) : 0;
  let h = `<div class="card"><h2>Session done</h2><div class="big">${run.score} / ${run.total}</div><div class="sub2">${pct}% right the first time</div>`;
  if (run.missed.length) {
    h += `<div class="tag">To revisit</div><div class="vlist">`;
    run.missed.forEach(it => { h += `<div class="vitem"><span>${summ(it)}</span></div>`; });
    h += '</div>';
  } else h += `<p>No misses. Nice work.</p>`;
  h += `<div class="flex" style="margin-top:14px"><button class="btn primary" data-act="again">Another round</button><button class="btn" data-act="home">Home</button></div></div>`;
  return h;
}
function summ(it){
  if (it.type === 'art') return esc(it.ref.art + ' ' + it.ref.word) + ' <small class="muted">' + esc(it.ref.en) + '</small>';
  if (it.type === 'ord') return esc(sentence(it.ref.alts[0], it.ref.p));
  if (it.type === 'plu') return esc(it.ref.art + ' ' + it.ref.word + ' → die ' + it.ref.plural);
  if (it.type === 'word') return esc(it.ref.de) + ' <small class="muted">' + esc(it.ref.en) + '</small>';
  if (it.type === 'verb') { const a = verbAsk(it); return esc(TENSE_LAB[it.tense] + ': ' + a.sentence); }
  return esc(it.ref.q) + ' <small class="muted">' + esc(it.ref.a) + '</small>';
}

/* ---------- conjugator ---------- */
function conjView(){
  if (conj.v) return conjDetail(DATA.verbs.filter(v => v.id === conj.v)[0]);
  const q = fold(conj.q.trim());
  let list = DATA.verbs.filter(v => {
    if (conj.f === 'irr' && !(v.vc || v.irr.some(Boolean))) return false;
    if (conj.f === 'sep' && !v.sep) return false;
    if (conj.f === 'modal' && !v.modal) return false;
    if (q && fold(v.inf).indexOf(q) < 0 && fold(v.en).indexOf(q) < 0) return false;
    return true;
  }).sort((a, b) => a.inf.localeCompare(b.inf, 'de'));
  let h = `<div class="card"><h2>Conjugator</h2><input type="search" id="cq" placeholder="Search a verb (German or English)" value="${esc(conj.q)}" autocapitalize="off" autocorrect="off" spellcheck="false">`;
  h += chips([['all','All'],['irr','Irregular'],['sep','Separable'],['modal','Modal']], v => conj.f === v, 'cf');
  h += `<div class="muted">${list.length} verbs</div><div class="vlist">`;
  list.forEach(v => { h += `<button class="vitem" data-act="cv" data-v="${v.id}"><span><b>${esc(v.inf)}</b> <small>${esc(v.en)}</small></span><small>${v.vc ? esc(v.vc) : ''}</small></button>`; });
  return h + '</div></div>';
}
function conjDetail(v){
  let h = `<div class="card"><div class="flex"><button class="btn small" data-act="cback">&larr; All verbs</button><span class="spacer"></span>${spk(v.inf)}</div><div class="big">${esc(v.inf)}</div><div class="sub2">${esc(v.en)}${v.vc ? ' &middot; vowel change ' + esc(v.vc) : ''}${v.modal ? ' &middot; modal' : ''}</div>`;
  if (v.sep) h += `<div class="note">Separable: in a main clause the prefix &ldquo;${esc(v.sep)}&rdquo; jumps to the end. In the Perfekt it goes in the middle: <b>${esc(v.part || '')}</b>.</div>`;
  h += `<h2>Präsens</h2><table class="forms">` + v.forms.map((f, i) => `<tr><td>${PERS[i]}</td><td class="${v.irr[i] ? 'irr' : ''}">${esc(f)}</td></tr>`).join('') + `</table><div class="muted" style="font-size:14px">Red = differs from the regular pattern.</div>`;
  if (v.part) {
    h += `<h2 style="margin-top:16px">Perfekt</h2><table class="forms">` + AUX[v.aux].map((a, i) => `<tr><td>${PERS[i]}</td><td>${esc(a + ' ' + v.part)}</td></tr>`).join('') + `</table><div class="sand">${esc('ich ' + AUX[v.aux][0] + ' [ ... ] ' + v.part)}</div><div class="muted" style="font-size:14px">Sandwich: helper in slot 2, Partizip II at the end.</div>`;
  } else h += `<p class="muted">No Perfekt: möchten is a form of mögen.</p>`;
  if (v.praet) h += `<h2 style="margin-top:16px">Präteritum</h2><table class="forms">` + v.praet.map((f, i) => `<tr><td>${PERS[i]}</td><td>${esc(f)}</td></tr>`).join('') + `</table><div class="muted" style="font-size:14px">Express lane: for sein, haben, werden and the modals people use this in speech.</div>`;
  if (v.imp) h += `<h2 style="margin-top:16px">Imperativ</h2><table class="forms">` + v.imp.map((f, i) => `<tr><td>${IMPP[i]}</td><td>${esc(f)}</td></tr>`).join('') + `</table>`;
  h += `<div class="flex" style="margin-top:14px">${spk(SAYPERS[0] + ' ' + v.forms[0], SAYPERS[0] + ' ' + v.forms[0])}${spk(SAYPERS[1] + ' ' + v.forms[1], SAYPERS[1] + ' ' + v.forms[1])}${v.part ? spk('ich ' + AUX[v.aux][0] + ' ' + v.part, 'ich ' + AUX[v.aux][0] + ' ' + v.part) : ''}</div>`;
  return h + '</div>';
}

/* ---------- cheat sheet ---------- */
function cheatView(){
  const SECTIONS = [
    ['tense', 'Tenses', [
      ['Perfekt = a sandwich', `Helper (<b>haben</b> or <b>sein</b>) sits in slot 2, the Partizip II is the last slice at the end.<div class="sand">Ich habe gestern Pizza gegessen.\nEr ist nach Zürich gefahren.</div>Use <b>sein</b> for movement and change of state: gehen, fahren, kommen, bleiben, sein, werden, passieren, aufstehen. Almost everything else takes <b>haben</b>.`],
      ['war / hatte = the express lane', `For <b>sein</b>, <b>haben</b> and the modals, people skip the sandwich and use the short past: ich <b>war</b>, ich <b>hatte</b>, ich <b>konnte</b>, ich <b>musste</b>, ich <b>wollte</b>. For all other verbs, speak in Perfekt.`]
    ]],
    ['order', 'Word order &amp; connectors', [
      ['Word order: the cinema row', `Seat 2 is reserved for the verb. Whatever comes first takes seat 1, so the subject may end up in seat 3.<div class="sand">Ich | fahre | morgen | nach Zürich.\nMorgen | fahre | ich | nach Zürich.\nAm Freitag | bin | ich | nach Madrid | geflogen.</div>Perfekt, modals and separable verbs: the second verb part takes the <b>very last seat</b>. Yes/no questions: verb in seat 1 (<i>Fährst du morgen?</i>). W-questions: question word in seat 1, verb in seat 2 (<i>Wann fährst du?</i>).`],
      ['After the verb: Time, Manner, Place', `When? then how? then where? Think <b>Te-Mo-Lo</b>.<div class="sand">Ich fahre morgen mit dem Zug nach Zürich.\n      (when)  (how)      (where)</div>`],
      ['weil / dass / wenn = the last wagon', `After weil, dass and wenn the conjugated verb is sent to the last wagon of the clause.<div class="sand">Ich lerne Deutsch, weil ich in der Schweiz arbeite.\nIch denke, dass er heute kommt.</div>`],
      ['denn vs. deshalb', `<b>denn</b> = "because" &mdash; behaves like <i>und</i>: it does NOT change word order, the next clause keeps its normal subject-verb order.<div class="sand">Ich bleibe zu Hause, denn ich bin krank.</div><b>deshalb</b> = "so, therefore" &mdash; it takes seat 1 itself, so the verb jumps right after it.<div class="sand">Ich bin krank, deshalb bleibe ich zu Hause.</div>`]
    ]],
    ['case', 'Cases &amp; prepositions', [
      ['Case coat check: three questions', `1) <b>The doer?</b> Nominative, nothing changes. 2) <b>Wen oder was?</b> Accusative: only der becomes den (ein becomes einen). 3) <b>A dative word before it?</b> mit, bei, aus, nach, seit, von, zu: dem / der / dem / den (+n on plurals). Also dative: helfen, danken, gehören, and the receiver of geben or schenken.`],
      ['Akkusativ: only the masculine changes', `der &rarr; <b>den</b>, ein &rarr; <b>einen</b>, kein &rarr; <b>keinen</b>. Die, das and the plural stay as they are. Ask: <i>Wen oder was?</i><div class="sand">Ich esse den Apfel.  Ich kaufe die Tasche.  Ich habe das Auto.</div>`],
      ['Dativ triggers', `<b>mit, bei, aus, nach, seit, von, zu</b> always take the dative: der &rarr; dem, die &rarr; der, das &rarr; dem, plural &rarr; den (+n). Ask: <i>Wem?</i><div class="sand">mit dem Bus · aus der Schweiz · bei den Eltern</div>`],
      ['Akkusativ triggers', `<b>für, durch, gegen, ohne, um, bis</b> always take the accusative.`],
      ['The doorway test: an, auf, hinter, in, neben, über, unter, vor, zwischen', `These nine prepositions can take Akkusativ or Dativ &mdash; it depends on whether something is moving. <b>Wohin?</b> (through the doorway, movement) = Akkusativ. <b>Wo?</b> (already on the other side, staying put) = Dativ.<div class="sand">Ich gehe in die Werkstatt. (wohin? &rarr; Akk.)\nIch bin in der Werkstatt. (wo? &rarr; Dativ)\nEr stellt das Buch auf den Tisch. (wohin?)\nDas Buch liegt auf dem Tisch. (wo?)</div>`]
    ]],
    ['other', 'Time &amp; gender', [
      ['Time words', `<b>am</b> + day or part of the day (am Montag, am Abend) &middot; <b>um</b> + clock time (um 8 Uhr) &middot; <b>im</b> + month or season (im Mai, im Sommer).<div class="sand">letzten Monat · letztes Jahr · letzte Woche\nnächsten Monat · nächstes Jahr · nächste Woche\njeden Tag · jedes Jahr · jede Woche</div>`],
      ['Gender hints', `<b>die</b>: -ung, -heit, -keit, -schaft, -ion, -tät, -ei, -ur &middot; <b>das</b>: -chen, -lein, -um, -ment &middot; <b>der</b>: -ling, -ismus, days, months, seasons. Exceptions exist, and the Articles drill flags them.`]
    ]]
  ];
  let h = '<div class="card"><h2>Cheat sheet</h2><p class="muted" style="margin-top:0">Short reminders that match your class. Full rules stay in your GoodNotes.</p>'
    + '<div class="flex" style="flex-wrap:wrap;gap:8px;margin-top:6px">' + SECTIONS.map(s => `<a class="chip" href="#cs-${s[0]}">${s[1]}</a>`).join('') + '</div></div>';
  SECTIONS.forEach(s => {
    h += `<h3 id="cs-${s[0]}" style="margin:20px 4px 8px;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.4px">${s[1]}</h3>`;
    h += s[2].map(c => `<div class="card"><h2>${c[0]}</h2><div>${c[1]}</div></div>`).join('');
  });
  return h;
}

/* ---------- progress ---------- */
function progressView(){
  const boxes = [0,0,0,0,0,0];
  Object.keys(S.cards).forEach(id => { const b = S.cards[id].box; if (b >= 1) boxes[b - 1]++; });
  const mx = Math.max(1, Math.max.apply(null, boxes));
  const labels = ['New/missed','1 day','3 days','1 week','2 weeks','Mastered'];
  const lessonTot = {}, lessonSeen = {};
  const add = (code, id) => { lessonTot[code] = (lessonTot[code] || 0) + 1; if (S.cards[id] && S.cards[id].n) lessonSeen[code] = (lessonSeen[code] || 0) + 1; };
  DATA.nouns.forEach(n => add(n.lesson, n.id + ':a'));
  DATA.words.forEach(w => add(w.lesson, w.id));
  DATA.verbs.forEach(v => add(v.lesson, v.id + ':pres'));
  let h = `<div class="card"><h2>Spaced-repetition boxes</h2><div class="muted" style="font-size:14px">Every item you answer moves up a box when you get it right (next review after 1, 3, 7, 16, 35 days) and drops back when you miss it.</div><div class="boxes">${boxes.map(b => `<div style="height:${Math.max(3, Math.round(80 * b / mx))}px"><span>${b}</span></div>`).join('')}</div><div class="boxlab">${labels.map(l => `<span>${l}</span>`).join('')}</div></div>`;
  h += `<div class="card"><h2>Started per lesson</h2>` + DATA.lessons.map(l => {
    const t = lessonTot[l.code] || 0, s = lessonSeen[l.code] || 0;
    return `<div class="lessonrow"><span>${esc(l.title)}</span><div class="bar"><i style="width:${t ? Math.round(100 * s / t) : 0}%"></i></div><span style="width:56px;text-align:right">${s}/${t}</span></div>`;
  }).join('') + `<div class="muted" style="font-size:13px">Counts nouns, words and verbs (present tense).</div></div>`;
  h += `<div class="card"><h2>Sync</h2>` + (fbUser
    ? `<p class="muted" style="margin-top:0">Signed in as ${esc(fbUser.displayName || fbUser.email || 'you')}. ${dbReady ? 'Progress syncs automatically across every device you sign in on — it also works fully offline in between and just catches up once you’re back online.' : 'Cloud sync isn’t reachable right now, so progress is only saving on this device. It will catch up once you’re back online.'}</p><button class="btn small ghost" data-act="signout">Sign out</button>`
    : `<p class="muted" style="margin-top:0">Sign in once per device with your Google account and progress stays the same on your phone and laptop — no downloads, no copy-paste. The app still works fully offline in between; it just syncs whenever you're back online.</p><button class="btn small" data-act="signin">Sign in with Google</button>`)
    + `<div class="flex" style="margin-top:10px"><button class="btn small" data-act="export">Show backup text</button><button class="btn small" data-act="copy">Copy</button></div>${exportText ? `<textarea id="exp" readonly>${esc(exportText)}</textarea>` : ''}<h2 style="margin-top:16px">Restore from text</h2><p class="muted" style="margin-top:0;font-size:14px">Only needed if you’re pasting in an old backup.</p><textarea id="imp" placeholder="Paste backup text here"></textarea><div class="flex" style="margin-top:8px"><button class="btn small" data-act="import">Restore from text</button></div>`;
  h += `<h2 style="margin-top:16px">Reset</h2><button class="btn small" data-act="reset">${resetArm ? 'Tap again to erase all progress' : 'Reset progress'}</button></div>`;
  return h;
}

/* ---------- checking typed answers ---------- */
const norm = (s, isImp) => {
  let x = fold(s.trim()).replace(/[!.,?]/g, '').replace(/\s+/g, ' ');
  if (!isImp) x = x.replace(/^(ich|du|er\/sie\/es|er\/sie|er|sie\/sie|sie|es|wir|ihr)\s+/, '');
  return x;
};
function check(){
  const it = cur(); if (!it || run.answered) return;
  if (it.type === 'ord') {
    if (run.used.length !== it.shuf.length) return;
    const built = run.used.map(k => chunkT(it.shuf[k]));
    const okO = it.ref.alts.some(a => a.every((c, i) => chunkT(c) === built[i]));
    answer(okO, cap1(built.join(' ')) + it.ref.p); return;
  }
  const inp = $('#ans'); if (!inp) return;
  const val = inp.value; if (!val.trim()) return;
  let ok = false;
  if (it.type === 'plu') ok = fold(val.trim().replace(/^die\s+/i, '')) === fold(it.ref.plural);
  else if (it.type === 'verb') { const a = verbAsk(it); ok = norm(val, it.tense === 'imp') === norm(a.expected, true); }
  answer(ok, val.trim());
}

/* ---------- events ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  switch (a) {
    case 'home': run = null; mode = null; conj.v = null; view = 'home'; render(); break;
    case 'signin': signIn(); break;
    case 'signout': signOutUser(); break;
    case 'theme': S.settings.theme = S.settings.theme === '' ? 'dark' : S.settings.theme === 'dark' ? 'light' : ''; save(); render(); break;
    case 'open': mode = b.dataset.m; view = 'setup'; render(); break;
    case 'view': view = v; if (v === 'conj') conj.v = null; render(); break;
    case 'lesson': {
      if (v === '') S.settings.lessons = [];
      else { const i = S.settings.lessons.indexOf(v); if (i >= 0) S.settings.lessons.splice(i, 1); else S.settings.lessons.push(v); }
      save(); render(); break;
    }
    case 'scope': S.settings.lessons = scopeCodes(v); save(); render(); break;
    case 'wdir': S.settings.wdir = v; save(); render(); break;
    case 'listen': S.settings.listen = v === '1'; save(); render(); break;
    case 'tense': S.settings.tense = v; save(); render(); break;
    case 'tricky': S.settings.tricky = v === '1'; save(); render(); break;
    case 'gcat': S.settings.gcat = v; save(); render(); break;
    case 'size': S.settings.size = +v; save(); render(); break;
    case 'ocat': S.settings.ocat = v; save(); render(); break;
    case 'guide': S.settings.guide = v === '1'; save(); render(); break;
    case 'place': if (!run.answered) { run.used.push(+b.dataset.i); render(); } break;
    case 'unplace': if (!run.answered) { run.used.splice(+b.dataset.k, 1); render(); } break;
    case 'oreset': run.used = []; render(); break;
    case 'start': case 'again': startRun(); break;
    case 'quit': view = run && run.total ? 'end' : 'home'; render(); break;
    case 'pick': if (!run.answered) { run.picked = v; answer(v === cur().ref.art, v); } break;
    case 'mc': if (!run.answered) { const c = cur(), correct = c.type === 'word' ? c.ref.en : c.ref.a; run.picked = v; answer(v === correct, v); } break;
    case 'check': check(); break;
    case 'next': next(); break;
    case 'mtap': {
      const cb = run.curBatch; if (!cb) break;
      const side = b.dataset.side, pi = +b.dataset.pi;
      if (cb.matched.has(pi)) break;
      if (side === 'l' && cb.listen && cb.dir === 'de') speak(cb.pairs[pi].ref.de);
      if (!cb.sel) { cb.sel = {side, pi}; render(); break; }
      if (cb.sel.side === side) { cb.sel = (cb.sel.pi === pi) ? null : {side, pi}; render(); break; }
      const leftPi = side === 'r' ? cb.sel.pi : pi;
      const rightPi = side === 'r' ? pi : cb.sel.pi;
      const leftItem = cb.pairs[leftPi];
      const correct = leftPi === rightPi;
      if (!cb.guessed.has(leftItem.id)) {
        cb.guessed.add(leftItem.id);
        grade(leftItem.id, correct);
        run.total++;
        if (correct) run.score++; else run.missed.push(leftItem);
        save();
      }
      if (correct) {
        cb.matched.add(leftPi); cb.sel = null; render();
      } else {
        cb.flash = {l:leftPi, r:rightPi}; cb.sel = null; render();
        setTimeout(() => { if (run && run.curBatch === cb) { cb.flash = null; render(); } }, 450);
      }
      break;
    }
    case 'matchnext':
      if (run.bi + 1 >= run.batches.length) { view = 'end'; }
      else { run.bi++; initBatch(); }
      render();
      break;
    case 'say': speak(b.dataset.t); break;
    case 'cf': conj.f = v; render(); break;
    case 'cv': conj.v = v; render(); window.scrollTo(0, 0); break;
    case 'cback': conj.v = null; render(); break;
    case 'export': exportText = JSON.stringify(S); render(); break;
    case 'copy': {
      exportText = JSON.stringify(S); render();
      const ta = $('#exp'); if (ta) { ta.select(); try { ta.setSelectionRange(0, exportText.length); } catch(x) {} }
      let done = false;
      try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(exportText); done = true; } } catch(x) {}
      if (!done) { try { done = document.execCommand('copy'); } catch(x) {} }
      break;
    }
    case 'import': {
      const t = $('#imp') ? $('#imp').value.trim() : '';
      try { const o = JSON.parse(t); if (!o || typeof o.cards !== 'object') throw new Error('bad'); const d = defaults(); S = Object.assign(d, o, {settings:Object.assign(d.settings, o.settings || {})}); save(); notice = 'Progress restored.'; }
      catch(x) { notice = 'That text is not a valid backup.'; }
      render(); break;
    }
    case 'reset':
      if (!resetArm) { resetArm = true; render(); }
      else { S = defaults(); save(); resetArm = false; exportText = ''; notice = 'Progress erased.'; render(); }
      break;
  }
});
app.addEventListener('input', e => {
  if (e.target.id === 'cq') {
    conj.q = e.target.value; const pos = e.target.selectionStart; render();
    const n = $('#cq'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch(x) {} }
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || view !== 'run' || !run || mode === 'word') return;
  const t = e.target;
  if (t && t.tagName === 'BUTTON') return;
  e.preventDefault();
  if (run.answered) next(); else check();
});
try { if ('speechSynthesis' in window) speechSynthesis.getVoices(); } catch(e) {}
render();
initFirebase();
window.__GT = {get S(){return S;}, get run(){return run;}, DATA};
})();
</script>
<script>
// PWA installability + offline caching + a light "new version available" banner
// for the weekly-rebuild workflow (see README.md "Redeploying").
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          if (sw.state === 'installed' && navigator.serviceWorker.controller) {
            const bar = document.createElement('div');
            bar.textContent = 'A new version is ready — tap to refresh.';
            bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;padding:12px 16px;background:#1f5fbf;color:#fff;text-align:center;font:15px/1.3 -apple-system,sans-serif;z-index:9999;cursor:pointer';
            bar.addEventListener('click', () => { sw.postMessage('SKIP_WAITING'); });
            document.body.appendChild(bar);
          }
        });
      });
    }).catch(() => {});
    let refreshed = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshed) return; refreshed = true; location.reload();
    });
  });
}
</script>
